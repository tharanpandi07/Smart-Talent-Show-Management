# ===========================================
# Smart Talent Exposure - Application Config
# ===========================================

server.port=8080

# ---------- MySQL Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_talent_exposure?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- CORS (handled in WebConfig, kept here for reference) ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB